<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css" type="text/css">
  <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
  <link rel="stylesheet" href="./viewer.css">
</head>

<body>
  <div id="viewer"></div>
  <div id="display-mode-buttons">
    <button id="toggle-pip" type="button" title="Picture-in-picture" aria-label="Toggle picture-in-picture" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><rect x="12" y="12" width="7" height="5" rx="1" class="filled" /></svg>
    </button>
    <button id="toggle-fullscreen" type="button" title="Full screen" aria-label="Toggle full screen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
    </button>
  </div>
  <script type="module" src="./viewer.js"></script>
</body>

</html>
